[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraseg-ai"
version = "0.1.0"
description = "Reproducible binary landslide segmentation experiments"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "matplotlib", "torch", "torchvision", "segmentation-models-pytorch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
